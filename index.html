<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        #msg-box {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 15px; background: rgba(0,0,0,0.8); color: #00ff00;
            border-radius: 15px; font-family: sans-serif; z-index: 10000;
            text-align: center; width: 80%; display: block;
        }
        #start-btn {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 20px; background: #007bff; color: white; border-radius: 10px;
            z-index: 10001; border: none; font-weight: bold;
        }
    </style>

    <script>
        // SHADER: Your working transparent video code
        AFRAME.registerShader('transparent-video', {
            schema: {
                src: {type: 'map'},
                color: {type: 'color', default: '#00ff00'},
                threshold: {type: 'number', default: 0.6}
            },
            init: function(data) {
                this.texture = new THREE.VideoTexture(data.src);
                this.material = new THREE.ShaderMaterial({
                    uniforms: {
                        tex: {value: this.texture},
                        keyColor: {value: new THREE.Color(data.color)},
                        threshold: {value: data.threshold}
                    },
                    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
                    fragmentShader: `
                        uniform sampler2D tex; uniform vec3 keyColor; uniform float threshold; varying vec2 vUv;
                        void main() {
                            vec4 fColor = texture2D(tex, vUv);
                            float diff = distance(fColor.rgb, keyColor);
                            if (diff < threshold) discard;
                            else gl_FragColor = fColor;
                        }
                    `,
                    transparent: true
                });
            },
            tick: function() { if (this.texture) this.texture.needsUpdate = true; }
        });

        let captured = false;

        AFRAME.registerComponent('hiro-logic', {
            init: function() {
                const msg = document.querySelector('#msg-box');
                const video = document.querySelector('#gs-video');
                const scene = this.el.sceneEl;

                // When Hiro Marker is seen
                this.el.addEventListener('markerFound', () => {
                    if(!captured) {
                        captured = true;
                        msg.innerHTML = "CLONING DONE! <br> Now tap the ground to spawn.";
                        video.play();
                    }
                });

                // Spawning Logic on Click
                scene.addEventListener('click', (evt) => {
                    if(captured) {
                        // Create a new plane
                        const newElement = document.createElement('a-plane');
                        
                        // Get 3D hit point from raycaster
                        const touchPos = evt.detail.intersection.point;
                        
                        newElement.setAttribute('position', touchPos);
                        newElement.setAttribute('rotation', '0 0 0'); // Standing upright
                        newElement.setAttribute('material', 'shader: transparent-video; src: #gs-video; threshold: 0.6');
                        newElement.setAttribute('width', '1');
                        newElement.setAttribute('height', '1.77');
                        
                        scene.appendChild(newElement);
                        msg.innerText = "Spawned! Tap again for more clones.";
                    }
                });
            }
        });
    </script>
</head>

<body style="margin: 0; overflow: hidden;">
    <button id="start-btn" onclick="this.style.display='none'; document.querySelector('#gs-video').play();">START EXPERIENCE</button>
    <div id="msg-box">Step 1: Scan the HIRO Marker</div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false;"
        cursor="rayOrigin: mouse"
        raycaster="objects: .clickable">

        <a-assets>
            <video id="gs-video" src="video.mp4" loop="true" crossorigin="anonymous" playsinline></video>
        </a-assets>

        <a-marker preset="hiro" hiro-logic>
            <a-plane material="shader: transparent-video; src: #gs-video" rotation="-90 0 0" width="1" height="1.77"></a-plane>
        </a-marker>

        <a-plane class="clickable" 
                 rotation="-90 0 0" 
                 position="0 -2 -5" 
                 width="50" height="50" 
                 material="opacity: 0.0; transparent: true">
        </a-plane>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
