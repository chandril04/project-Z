<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; position: fixed; width: 100%; height: 100%; background: #000; }
        video { width: 100vw !important; height: 100vh !important; object-fit: cover !important; }
        
        #msg-box {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 15px; background: rgba(0,0,0,0.8); color: #00ff00;
            border-radius: 10px; font-family: sans-serif; z-index: 10000;
            width: 80%; text-align: center; pointer-events: none;
        }
        #start-btn {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            padding: 20px; background: #28a745; color: white; border-radius: 10px;
            z-index: 10001; border: none; font-weight: bold;
        }
    </style>

    <script>
        // SHADER: Transparent Video
        AFRAME.registerShader('transparent-video', {
            schema: {
                src: {type: 'map'},
                color: {type: 'color', default: '#00ff00'},
                threshold: {type: 'number', default: 0.6}
            },
            init: function(data) {
                this.texture = new THREE.VideoTexture(data.src);
                this.material = new THREE.ShaderMaterial({
                    uniforms: {
                        tex: {value: this.texture},
                        keyColor: {value: new THREE.Color(data.color)},
                        threshold: {value: data.threshold}
                    },
                    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
                    fragmentShader: `
                        uniform sampler2D tex; uniform vec3 keyColor; uniform float threshold; varying vec2 vUv;
                        void main() {
                            vec4 fColor = texture2D(tex, vUv);
                            float diff = distance(fColor.rgb, keyColor);
                            if (diff < threshold) discard;
                            else gl_FragColor = fColor;
                        }
                    `,
                    transparent: true
                });
            },
            tick: function() { if (this.texture) this.texture.needsUpdate = true; }
        });

        let isReady = false;

        AFRAME.registerComponent('hiro-logic', {
            init: function() {
                const msg = document.querySelector('#msg-box');
                const video = document.querySelector('#gs-video');
                
                this.el.addEventListener('markerFound', () => {
                    if(!isReady) {
                        isReady = true;
                        msg.innerHTML = "CLONED! <br> Point at floor and TAP.";
                        video.play();
                    }
                });

                // Listening for clicks on the scene itself
                this.el.sceneEl.addEventListener('click', (evt) => {
                    if(isReady && evt.detail.intersection) {
                        const newClone = document.createElement('a-plane');
                        const hitPos = evt.detail.intersection.point;
                        
                        // We place it slightly in front of the hit point so it's visible
                        newClone.setAttribute('position', {x: hitPos.x, y: hitPos.y + 0.8, z: hitPos.z});
                        newClone.setAttribute('rotation', '0 0 0');
                        newClone.setAttribute('material', 'shader: transparent-video; src: #gs-video; threshold: 0.6');
                        newClone.setAttribute('width', '1');
                        newClone.setAttribute('height', '1.77');
                        
                        this.el.sceneEl.appendChild(newClone);
                    }
                });
            }
        });
    </script>
</head>

<body>
    <button id="start-btn" onclick="this.style.display='none'; document.querySelector('#gs-video').play();">START CAMERA</button>
    <div id="msg-box">Focus on the Hiro Marker</div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; 
              sourceWidth: 640; sourceHeight: 480; 
              displayWidth: 640; displayHeight: 480; 
              debugUIEnabled: false; 
              videoTexture: true;"
        cursor="rayOrigin: mouse"
        raycaster="objects: .surface-plane"
        vr-mode-ui="enabled: false">

        <a-assets>
            <video id="gs-video" src="video.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
        </a-assets>

        <a-marker preset="hiro" hiro-logic>
            <a-plane material="shader: transparent-video; src: #gs-video" rotation="-90 0 0" width="1" height="1.77"></a-plane>
        </a-marker>

        <a-plane class="surface-plane" 
                 rotation="-90 0 0" 
                 position="0 -1.5 0" 
                 width="100" height="100" 
                 material="opacity: 0.0; transparent: true">
        </a-plane>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
</html>
